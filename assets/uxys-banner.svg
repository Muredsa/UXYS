<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">UXYS — User eXperience Yield System</title>
  <desc id="desc">Intent-first UX analysis for AI agents: Intent to Evidence to Shortest Sufficient Route to Friction to Destination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#efede5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#111111" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="464" rx="28" fill="none" stroke="#111111" stroke-opacity="0.12"/>

  <g transform="translate(96 84)">
    <g aria-hidden="true" transform="translate(0 6)">
      <circle cx="26" cy="26" r="5" fill="#111111"/>
      <path d="M26 0v14M26 38v14M0 26h14M38 26h14M8 8l10 10M34 34l10 10M44 8L34 18M18 34L8 44" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="72" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="#111111" letter-spacing="-2">UXYS</text>
    <text x="72" y="76" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#55534d">User eXperience Yield System</text>

    <text x="0" y="152" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#111111">Intent-first UX analysis for AI agents.</text>
    <text x="0" y="193" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" fill="#5f5c55">Model the interface as a network of short, sufficient routes — not a generic UX checklist.</text>
  </g>

  <g transform="translate(98 342)" filter="url(#shadow)">
    <g>
      <rect x="0" y="0" width="220" height="78" rx="18" fill="#111111"/>
      <text x="110" y="49" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">INTENT</text>
    </g>
    <text x="251" y="49" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#111111">→</text>
    <g transform="translate(286 0)">
      <rect width="220" height="78" rx="18" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="110" y="49" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#111111">EVIDENCE</text>
    </g>
    <text x="537" y="49" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#111111">→</text>
    <g transform="translate(572 0)">
      <rect width="300" height="78" rx="18" fill="#b7ff35" stroke="#111111" stroke-opacity="0.10"/>
      <text x="150" y="34" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#111111">SHORTEST SUFFICIENT</text>
      <text x="150" y="58" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#111111">ROUTE</text>
    </g>
    <text x="903" y="49" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#111111">→</text>
    <g transform="translate(938 0)">
      <rect width="220" height="78" rx="18" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="110" y="49" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#111111">FRICTION</text>
    </g>
    <text x="1189" y="49" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#111111">→</text>
    <g transform="translate(1224 0)">
      <rect width="220" height="78" rx="18" fill="#111111"/>
      <text x="110" y="49" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">DESTINATION</text>
    </g>
  </g>
</svg>
